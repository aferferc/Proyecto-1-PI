- name: Configuracion router
  hosts: balanceador
  become: true
  roles:
    - commons
    - router
    
- name: Configuración comun a todos los hosts
  hosts: all
  become: true
  roles:
    - commons  
    
- name: Configurar apache2 con mod php
  hosts: 
      - web1
      - web2
  become: true
  roles:
    - apache_php
    
- name: Configurar mariadb
  hosts: bd
  become: true
  roles:
    - mariadb
    
- name: Configurar haproxy
  hosts: balanceador
  become: true
  roles:
    - haproxy