- name: Instalar nginx con php-fpm
  ansible.builtin.apt:
    name: 
      - nginx
      - php-fpm
      - php-mysqli
      - php-mbstring
      - php-zip
      - php-gd
      - php-json
      - php-curl
      - php-xml
    state: present

- name: Añadir formato de log para ver las ip que acceden a pma
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    insertafter: '^\s*http\s*\{'
    regexp: '^\s*log_format\s+balanceado\b'
    line: "\tlog_format balanceado '$http_x_forwarded_for - $remote_user [$time_local] \"$request\" $status $body_bytes_sent';"
  notify: Recargar nginx

- name: Configuracion del vhost para pma
  ansible.builtin.template:
    src: vhost.j2
    dest: "/etc/nginx/sites-enabled/phpmyadmin"
    owner: root
    group: root
    mode: "0644"
  notify: Recargar nginx
  
#Desactivamos el vhost por defecto de nginx para evitar conflictos
- name: Desactiva vhost por defecto
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  
- name: Crear documentroot pma
  ansible.builtin.file:
    path: /var/www/phpmyadmin
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    
#Como phpmyadmin tiene una gran cantidad de ficheros, si usamos el modulo file que usa scp tardara demasiado, así que usamos el modulo posix.synchronize que trabaja con rsync y sera mucho mas rapido
- name: Copiar phpmyadmin al document root
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: /var/www/phpmyadmin/
    use_ssh_args: true
    owner: false
    group: false
    rsync_opts:
      - "--chmod=D0755,F0644"
      - "--chown=www-data:www-data"