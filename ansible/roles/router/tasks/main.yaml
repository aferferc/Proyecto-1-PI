- name: Asegurar que iptables esta instalado
  ansible.builtin.apt:
    name: 
      - iptables
    state: present
  
- name: Activar Forwarding
  ansible.builtin.copy:
    src: 99-forward.conf
    dest: "/etc/sysctl.d/99-forward.conf"
    owner: root
    group: root
    mode: '0755'
  notify: Reiniciar sysctl

- name: Copiar el script de iptables
  ansible.builtin.copy:
    src: iptables-nat.sh
    dest: "/usr/local/bin/iptables-nat.sh"
    owner: root
    group: root
    mode: '0755'
    
- name: Copiar y activar unidad systemd para arranque automatico de nat
  ansible.builtin.copy:
    src: iptables-nat.service
    dest: "/etc/systemd/system/iptables-nat.service"
    owner: root
    group: root
    mode: '0755'
  notify:
    - Recargar systemd
    - Activar nat