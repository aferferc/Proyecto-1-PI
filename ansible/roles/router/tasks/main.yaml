- name: Asegurar que iptables esta instalado
  ansible.builtin.apt:
    name: 
      - iptables
    state: present
  
- name: Activar Forwarding
  ansible.builtin.copy:
    src: 99-forward.conf
    dest: "/etc/sysctl.d/99-forward.conf"
    owner: root
    group: root
    mode: '0755'
  notify: Reiniciar sysctl

- name: Copiar el script de iptables
  ansible.builtin.copy:
    src: iptables-nat.sh
    dest: "/usr/local/bin/iptables-nat.sh"
    owner: root
    group: root
    mode: '0755'
    
- name: Copiar y activar unidad systemd para arranque automatico de nat
  ansible.builtin.copy:
    src: iptables-nat.service
    dest: "/etc/systemd/system/iptables-nat.service"
    owner: root
    group: root
    mode: '0755'
  notify:
    - Recargar systemd
    - Activar nat
    
#Como el router es ahora la unica forma que tienen los servidores de acceder a internet, y los cloud init necesitan hacer consultas a internet para terminar de confiugrar las maquinas, hacemos que justo despues de configurar el balanceador como router ansible espere un poco a que los cloud init acaben de configurar.

#Ademas, como por defecto asible ejecuta los handlers al final de la play, tenemos que hacer todos se ejecuten antes de la espera o la espera no habra servido para nada, para eso usamos flush_handlers del modulo meta

- name: Ejecutar handlers antes de espera
  ansible.builtin.meta: flush_handlers

- name: Esperar a cloud init de servidores antes de continuar
  ansible.builtin.pause:
    seconds: 90