- name: Instalar apache2 con mod php
  ansible.builtin.apt:
    name: 
      - apache2
      - libapache2-mod-php
    state: present
    
- name: Crear el DocumentRoot de cada virtual host
  ansible.builtin.file:
    path: "{{ item.documentroot }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ virtualhosts }}"
  
- name: Configuración de cada virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.nombre }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ virtualhosts }}"
  notify: Recargar apache2

- name: Activar cada virtual host
  ansible.builtin.command:
    cmd: "a2ensite {{ item.nombre }}"
    creates: "/etc/apache2/sites-enabled/{{ item.nombre }}.conf"
  loop: "{{ virtualhosts }}"
  notify: Recargar apache2
  
- name: Desactivar la pagina por defecto
  ansible.builtin.command:
    cmd: "a2dissite 000-default.conf"
  notify: Recargar apache2
  
