- name: Instalar mariadb
  ansible.builtin.apt:
    name: 
      - mariadb-server
      - python3-pymysql
    state: present

- name: Configurar bind-address en MariaDB para escuchar al server web
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address\s*='
    line: 'bind-address = {{ ip.bd_interna }}'
  notify: Reiniciar mariadb
  
- name: Crear base de datos para la app
  ansible.mariadb.mariadb_db:
    name: "{{ app.bd.nombre }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Crear usuario de para la bd de la app
  ansible.mariadb.mariadb_user:
    name: "{{ app.bd.usuario }}"
    password: "{{ app.bd.contraseña }}"
    host: "%"
    priv: "{{ app.bd.nombre }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
   
#Esta tarea tiene como unico proposito comprobar que la tabla para la bd no exista, ya que no hay un modulo especifico para hacer idempotente la creacion de tablas de forma directa, asi que la hacemos idempotente usando esta tarea como un triguer que permitira que ansible ejecute la creacion de la tabla, que de por si tambien seria idempotente aunque se ejecutase siempre ya que le puse IF NOT EXIST al CREATE TABLE. Aun asi con esta comprobacion ansible no nos arroja changed siempre ya que solo ejecuta el create table si no esta la tabla.
- name: Verificar si la tabla 'messages' ya existe
  ansible.mariadb.mariadb_query:
    login_user: "{{ app.bd.usuario }}"
    login_password: "{{ app.bd.contraseña }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ app.bd.nombre }}"
    query: "SHOW TABLES LIKE 'messages';"
  register: table_check
 
- name: Crear tablas base
  ansible.mariadb.mariadb_query:
    login_user: "{{ app.bd.usuario }}"
    login_password: "{{ app.bd.contraseña }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ app.bd.nombre }}"
    query: |
      CREATE TABLE IF NOT EXISTS messages (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(50) NOT NULL,
        message TEXT NOT NULL,
        created_at DATETIME NOT NULL
      ) ENGINE=InnoDB;
  changed_when: table_check.query_result[0] | length == 0
