#cloud-config
hostname: bd

timezone: Europe/Madrid
locale: es_ES.UTF-8

keyboard:
  layout: es

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    ssh-authorized-keys:
      - ssh-rsa  alfre@ChuwiCorebookX

chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ubuntu
      type: text

packages:
  - qemu-guest-agent

package_update: true
package_upgrade: true
